<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorpresa</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(#e87cdd, #efe684);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}
.fondo {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: 0;
}
.girasol {
    position: absolute;
    animation: caer linear infinite;
}
@keyframes caer {
    0% { transform: translateY(-100px) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
}
.container {
    width: 500px;
    height: 680px;
    background: #ffffff;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    position: relative;
    z-index: 2;
    overflow: visible;
}
.decor-flor {
    position: absolute;
    width: 180px;
    z-index: 5;
    pointer-events: none;
}
.flor1 {
    top: -60px;
    left: -60px;
}
.flor2 {
    bottom: -60px;
    right: -60px;
}
.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 25px;
}
.slide.active {
    display: flex;
}
h1 {
    color: #de30ed;
    font-size: 42px;
    text-align: center;
}
.slide p {
    text-align: center;
    color: #de30ed;
    font-size: 18px;
}
.slide img {
    width: 460px;
    max-width: 120%;
    margin-top: 10px;
}
.botones {
    position: absolute;
    bottom: 15px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 10px;
}
.botones button {
    background: #de30ed;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 25px;
    font-size: 14px;
    cursor: pointer;
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}
.carta-slide {
    justify-content: center;
    align-items: center;
}
.hoja-carta {
    width: 85%;
    max-width: 380px;
    height: 85%;
    background: #fffef8;
    padding: 30px 25px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow-y: auto;
    font-size: 18px;
    line-height: 1.8;
    color: #222;
    text-align: justify;
}
.fecha {
    text-align: right;
    margin-bottom: 20px;
}
.destinatario {
    margin-bottom: 15px;
    text-align: left;
}
.hoja-carta p {
    margin-bottom: 16px;
}
.despedida {
    margin-top: 20px;
}
.firma {
    margin-top: 5px;
}
</style>
</head>
<body>
<div class="fondo" id="fondo"> </div>
<div class="container">

    <!-- SLIDE 1 -->
    <div class="slide active">
        <h1>Para Dayami Salazar💛💛</h1>
        <p>Un pequeño detalle para ti...</p>
        <div class="botones">
            <button onclick="nextSlide()">Siguiente ➜</button>
        </div>
    </div>
    <div class="slide">
        <img src="flower.jpg">
        <p class="despedida">Con cariño, YO JSJS</p>
        <div class="botones">
            <button onclick="goTo(0)">🏠 Inicio</button>
        </div>
    </div>

</div>
<script>
let current = 0;
const slides = document.querySelectorAll(".slide");
function showSlide(index) {
    slides[current].classList.remove("active");
    current = index;
    slides[current].classList.add("active");
}
function nextSlide() {
    let next = current + 1;
    if (next >= slides.length) next = 0;
    showSlide(next);
}
function goTo(index) {
    showSlide(index);
}
const fondo = document.getElementById("fondo");
for (let i = 0; i < 25; i++) {
    let flor = document.createElement("img");
    flor.src = "Sunflower-PNG-HD.png";
    flor.className = "girasol";
    flor.style.left = Math.random() * 100 + "vw";
    const duracion = 5 + Math.random() * 5;
    flor.style.animationDuration = duracion + "s";
    flor.style.animationDelay = (-Math.random() * duracion) + "s";
    flor.style.width = (25 + Math.random() * 35) + "px";
    fondo.appendChild(flor);
}
</script>
</body>
</html>
